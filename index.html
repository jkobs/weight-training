<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weight Training</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weight Training">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f1115; --card: #191c23; --card2: #222632; --text: #eef0f4; --muted: #8b92a3;
    --accent: #ff7a1a; --accent-dim: #3a2615; --good: #35c46f; --line: #2b303c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  :root { color-scheme: dark; }
  body { padding-block: env(safe-area-inset-top, 0px) calc(84px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    max-width: 560px; margin: 0 auto; }
  .toast { position: fixed; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); max-width: 528px; margin: 0 auto;
    background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; z-index: 20; font-weight: 600; }
  .btn.warn { background: #b3402a; color: #fff; }
  h1 { font-size: 28px; margin: 18px 0 4px; }
  h2 { font-size: 20px; margin: 22px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin: 12px 0; }
  .row { display: flex; align-items: center; gap: 10px; }
  .spread { justify-content: space-between; }
  .big { font-size: 34px; font-weight: 700; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    background: var(--accent-dim); color: var(--accent); border-radius: 999px; padding: 3px 10px; }
  .muted { color: var(--muted); }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .btn { background: var(--accent); color: #fff; font-weight: 650; border-radius: 12px; padding: 14px 18px; width: 100%; font-size: 17px; }
  .btn.secondary { background: var(--card2); color: var(--text); }
  .btn.small { width: auto; padding: 8px 14px; font-size: 15px; }
  input, textarea { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; width: 100%; font-size: 17px; }
  label { display: block; color: var(--muted); font-size: 14px; margin: 12px 0 6px; }
  .set { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .set:first-of-type { border-top: 0; }
  .check { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: transparent;
    flex: none; display: grid; place-items: center; font-size: 20px; }
  .check.done { background: var(--good); border-color: var(--good); color: #0f1115; }
  .set .what { flex: 1; }
  .set .w { font-weight: 650; font-size: 18px; }
  .reps { width: 64px; text-align: center; padding: 8px; }
  .plates { font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cell { background: var(--card2); border-radius: 12px; padding: 10px; text-align: left; min-height: 64px; }
  .cell.done { outline: 2px solid var(--good); }
  .cell.next { outline: 2px solid var(--accent); }
  .cell b { display: block; font-size: 14px; }
  .cell span { font-size: 12px; color: var(--muted); }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(15,17,21,.96); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(10px); }
  nav button { flex: 1; background: none; padding: 12px 0 10px; color: var(--muted); font-size: 13px; font-weight: 600; }
  nav button.on { color: var(--accent); }
  nav svg { display: block; margin: 0 auto 3px; width: 24px; height: 24px; }
  .timer { position: fixed; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto;
    background: var(--accent); color: #fff; border-radius: 14px; padding: 12px 16px; display: none; font-weight: 650; }
  .timer.on { display: flex; }
  body.timing { padding-bottom: calc(160px + env(safe-area-inset-bottom)); }
  .timer.over { background: var(--good); color: #0f1115; }
  .bar { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 99px; }
  ul.acc { list-style: none; padding: 0; margin: 0; }
  ul.acc li { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  ul.acc .check { width: 36px; height: 36px; font-size: 16px; }
  .note { font-size: 14px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td, th { text-align: left; padding: 8px 4px; border-top: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; border-top: 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

<div class="timer row spread" id="timer">
  <span id="timerText">Rest 2:00</span>
  <button class="btn small secondary" id="timerStop">Done</button>
</div>

<nav id="nav" class="hidden">
  <button data-tab="today" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4v16M18 4v16M3 8v8M21 8v8M6 12h12"/></svg>Today</button>
  <button data-tab="program">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Program</button>
  <button data-tab="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
</nav>

<script>
"use strict";

// ---- Program definition: weights are fractions of the lifter's current estimated 1-rep max ----
const PROGRAM = [
  { week: 1, days: [
    { name: "Heavy", sets: 5, reps: 5, pct: 0.79, rest: 180, acc: ["Close-grip bench 3×8", "Barbell rows 4×10"] },
    { name: "Volume", sets: 4, reps: 8, pct: 0.68, rest: 120, acc: ["Incline dumbbell press 3×10", "Triceps pushdowns 3×12"] },
    { name: "Paused", sets: 3, reps: 5, pct: 0.68, rest: 120, paused: true, acc: ["Dumbbell rows 3×10", "Face pulls 3×15"] } ] },
  { week: 2, days: [
    { name: "Heavy", sets: 5, reps: 4, pct: 0.85, rest: 180, acc: ["Close-grip bench 3×8", "Barbell rows 4×10"] },
    { name: "Volume", sets: 4, reps: 8, pct: 0.71, rest: 120, acc: ["Incline dumbbell press 3×10", "Triceps pushdowns 3×12"] },
    { name: "Paused", sets: 3, reps: 5, pct: 0.71, rest: 120, paused: true, acc: ["Dumbbell rows 3×10", "Face pulls 3×15"] } ] },
  { week: 3, days: [
    { name: "Heavy", sets: 3, reps: 3, pct: 0.88, rest: 180, amrap: 0.79, acc: ["Close-grip bench 3×8", "Barbell rows 4×10"] },
    { name: "Volume", sets: 4, reps: 6, pct: 0.74, rest: 120, acc: ["Incline dumbbell press 3×10", "Triceps pushdowns 3×12"] },
    { name: "Paused", sets: 3, reps: 4, pct: 0.74, rest: 120, paused: true, acc: ["Dumbbell rows 3×10", "Face pulls 3×15"] } ] },
  { week: 4, days: [
    { name: "Deload", sets: 3, reps: 3, pct: 0.79, rest: 120, acc: ["Barbell rows 3×10"] },
    { name: "Deload", sets: 3, reps: 3, pct: 0.68, rest: 120, acc: ["Face pulls 2×15"] },
    { name: "Max test", test: true, rest: 210, acc: [] } ] },
];
// Max-test ladder: [fraction of max, reps]; the last two are optional attempts
const TEST_LADDER = [[0.56, 5], [0.79, 3], [0.91, 1], [1.0, 1], [1.06, 1], [1.09, 1], [1.12, 1]];
const BAR = 45, BLOCK_WEEKS = 4;
const DURATIONS = [4, 8, 12, 16];
// Rough planning figure for a lifter at this level: about 10 lb per 4-week block
const GAIN_PER_BLOCK = 10;
const KEY = "bench225-v1";

// ---- Storage ----
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s) { s.goal ??= 225; s.weeks ??= 4; } // saves from before goal and length existed
    return s || null;
  } catch { return null; }
}
const totalBlocks = () => state.weeks / BLOCK_WEEKS;
const overallWeek = w => (state.block - 1) * BLOCK_WEEKS + w;
function projection(max, weeks) { return max + Math.round(weeks / BLOCK_WEEKS) * GAIN_PER_BLOCK; }
function weeksNeeded(max, goal) { return goal <= max ? 0 : Math.ceil((goal - max) / GAIN_PER_BLOCK) * BLOCK_WEEKS; }
function outlook(max, goal, weeks) {
  const proj = projection(max, weeks), need = weeksNeeded(max, goal);
  if (goal <= max) return `You're already at ${goal}. Set a higher goal.`;
  if (proj >= goal) return `On track: about ${proj} lb is typical after ${weeks} weeks, so ${goal} is realistic.`;
  return `About ${proj} lb is typical after ${weeks} weeks. ${goal} usually takes about ${need} weeks.`;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}
let state = load();
let tab = "today";
let viewing = null; // session id being viewed from the Program tab

// ---- Math ----
const roundTo5 = w => Math.max(BAR, Math.round(w / 5) * 5);
const epley = (w, r) => r <= 1 ? w : w * (1 + r / 30);
function platesPerSide(total) {
  let side = (total - BAR) / 2;
  if (side <= 0) return "Empty bar";
  const out = [];
  for (const p of [45, 35, 25, 10, 5, 2.5]) {
    while (side >= p - 0.001) { out.push(p); side -= p; }
  }
  return out.join(" + ") + " per side";
}
const sid = (w, d) => `b${state.block}w${w}d${d}`;
const allSessions = () => PROGRAM.flatMap(wk => wk.days.map((day, i) => ({ week: wk.week, d: i + 1, day })));
const sessionLog = id => (state.log[id] ||= { sets: {}, acc: {}, done: false });
function nextSession() {
  return allSessions().find(s => !state.log[sid(s.week, s.d)]?.done) || null;
}
function setsFor(day) {
  const max = state.max;
  if (day.test) return TEST_LADDER.map(([p, r], i) => ({ w: roundTo5(max * p), reps: r, optional: i >= 5 }));
  const list = Array.from({ length: day.sets }, () => ({ w: roundTo5(max * day.pct), reps: day.reps }));
  if (day.amrap) list.push({ w: roundTo5(max * day.amrap), reps: "max", amrap: true });
  return list;
}
function warmups(work) {
  return [[BAR, 10], [roundTo5(work * 0.5), 5], [roundTo5(work * 0.7), 3]]
    .filter(([w], i, a) => i === 0 || (w > BAR && w < work && w !== a[i - 1][0]));
}

// ---- Rendering helpers ----
const $ = s => document.querySelector(s);
// In-page messages and confirmations (alert/confirm are blocked inside some viewers)
let toastId = 0;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastId); toastId = setTimeout(() => { t.hidden = true; }, 3500);
}
function confirmTap(btn, question, action) {
  if (btn.dataset.armed) { action(); return; }
  const label = btn.textContent; btn.dataset.armed = "1"; btn.textContent = question; btn.classList.add("warn");
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = label; btn.classList.remove("warn"); }, 4000);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function render() {
  const app = $("#app");
  $("#nav").classList.toggle("hidden", !state);
  if (!state) { app.innerHTML = setupView(); bindSetup(); return; }
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (tab === "today") { app.innerHTML = todayView(); bindSession(); }
  else if (tab === "program") { app.innerHTML = programView(); bindProgram(); }
  else { app.innerHTML = progressView(); bindProgress(); }
  window.scrollTo(0, 0);
}

// ---- Setup ----
function setupView(prefill) {
  return `
  <h1>Weight Training</h1>
  <p class="sub">Pick a target and a length. The program runs in 4-week blocks, each ending with a max test that sets the next block's weights, so each person gets their own numbers.</p>
  <div class="card">
    <label for="name">Your name</label>
    <input id="name" autocomplete="off" value="${esc(prefill?.name || "")}" placeholder="e.g. Dad">
    <label>A recent set you did with good form</label>
    <div class="row">
      <input id="w" type="number" inputmode="decimal" placeholder="Weight" value="${prefill?.w || ""}">
      <span class="muted">lb ×</span>
      <input id="r" type="number" inputmode="numeric" placeholder="Reps" value="${prefill?.r || ""}" style="max-width:90px">
    </div>
    <p class="note" id="est">Example: 135 × 8. Use a set of 10 reps or fewer for the best estimate.</p>
    <label for="goal">Target bench (lb)</label>
    <input id="goal" type="number" inputmode="decimal" value="225">
    <label for="weeks">Program length</label>
    <div class="row" id="weeks" role="radiogroup" style="flex-wrap:wrap">
      ${DURATIONS.map(d => `<button class="btn small ${d === 8 ? "" : "secondary"}" data-weeks="${d}" role="radio" aria-checked="${d === 8}">${d} weeks</button>`).join("")}
    </div>
    <p class="note" id="outlook"></p>
    <button class="btn" id="start">Build my program</button>
  </div>
  <p class="note">Data stays on this phone only. Use a spotter or safety pins on heavy days and the max test.</p>`;
}
function bindSetup() {
  let weeks = 8;
  const upd = () => {
    const w = +$("#w").value, r = +$("#r").value, goal = +$("#goal").value;
    if (w > 0 && r > 0) {
      const max = Math.round(epley(w, r));
      $("#est").textContent = `Estimated 1-rep max: ${max} lb`;
      $("#outlook").textContent = goal > 0 ? outlook(max, goal, weeks) : "";
    }
  };
  $("#w").oninput = upd; $("#r").oninput = upd; $("#goal").oninput = upd;
  document.querySelectorAll("[data-weeks]").forEach(b => b.onclick = () => {
    weeks = +b.dataset.weeks;
    document.querySelectorAll("[data-weeks]").forEach(x => {
      const on = x === b; x.classList.toggle("secondary", !on); x.setAttribute("aria-checked", on);
    });
    upd();
  });
  $("#start").onclick = () => {
    const name = $("#name").value.trim() || "Lifter";
    const w = +$("#w").value, r = +$("#r").value, goal = Math.round(+$("#goal").value);
    if (!(w >= BAR) || !(r >= 1 && r <= 15)) { $("#est").textContent = "Enter a weight of at least 45 lb and 1–15 reps."; return; }
    const max = Math.round(epley(w, r));
    if (!(goal > max)) { $("#outlook").textContent = `Set a target above your current max of ${max} lb.`; return; }
    state = { name, max, goal, weeks, block: 1, startMax: max, log: {}, history: [{ block: 1, max, date: new Date().toISOString(), source: `${w} × ${r}` }] };
    save(); tab = "today"; render();
  };
}

// ---- Session (Today) ----
function todayView() {
  if (state.block > totalBlocks()) return `<h1>Program complete</h1>
    <p class="sub">${state.weeks} weeks done. Max ${state.startMax} → ${state.max} lb${state.max >= state.goal ? `: you hit ${state.goal}!` : `, goal ${state.goal}.`}</p>
    <div class="card note">Add more weeks or set a new goal in Progress to keep going.</div>`;
  const s = viewing || nextSession();
  if (!s) return `<h1>Block ${state.block} done</h1><p class="sub">Log your max test result in Progress to start the next block.</p>`;
  const { week, d, day } = s;
  const id = sid(week, d), log = sessionLog(id);
  const sets = setsFor(day);
  const isNext = nextSession() && sid(nextSession().week, nextSession().d) === id;
  const topWork = Math.max(...sets.map(x => x.w));
  const warm = day.test ? [] : warmups(topWork);
  return `
  <div class="row spread" style="margin-top:18px">
    <span class="tag">Week ${overallWeek(week)} of ${state.weeks} · Day ${d}</span>
    ${viewing && !isNext ? `<button class="btn small secondary" id="backNext">Go to next</button>` : ""}
  </div>
  <h1>${esc(day.name)}${day.paused ? " · 2-sec pause" : ""}</h1>
  <p class="sub">${esc(state.name)} · max ${state.max} → goal ${state.goal} lb${day.test ? "" : ` · rest ${Math.round(day.rest / 60 * 10) / 10} min`}</p>
  ${day.test ? `<div class="card note">Rest 3–4 minutes between singles. Stop at the first slow, grinding rep, and log the heaviest clean single below. The last two are optional: only try them if the one before moved fast.</div>` : ""}
  ${warm.length ? `<div class="card"><b>Warm-up</b><p class="note" style="margin:6px 0 0">${warm.map(([w, r]) => `${w} × ${r}`).join(" · ")}</p></div>` : ""}
  <div class="card">
    ${sets.map((x, i) => {
      const st = log.sets[i] || {};
      return `<div class="set">
        <button class="check ${st.done ? "done" : ""}" data-set="${i}" aria-label="Mark set ${i + 1} done">${st.done ? "✓" : i + 1}</button>
        <div class="what">
          <div class="w">${x.w} lb × ${x.reps === "max" ? "max reps" : x.reps}${x.optional ? ' <span class="muted" style="font-weight:400">(optional)</span>' : ""}</div>
          <div class="plates">${platesPerSide(x.w)}</div>
        </div>
        ${x.amrap || day.test ? "" : `<input class="reps" type="number" inputmode="numeric" data-reps="${i}" value="${st.reps ?? x.reps}" aria-label="Reps done">`}
        ${x.amrap ? `<input class="reps" type="number" inputmode="numeric" data-reps="${i}" value="${st.reps ?? ""}" placeholder="reps" aria-label="Reps done">` : ""}
      </div>`;
    }).join("")}
    ${day.amrap ? `<p class="note" id="amrapNote">${amrapNote(log, sets)}</p>` : ""}
  </div>
  ${day.test ? `<div class="card">
      <label for="testMax">Heaviest clean single today (lb)</label>
      <input id="testMax" type="number" inputmode="decimal" value="${log.testMax || ""}">
    </div>` : ""}
  ${day.acc.length ? `<div class="card"><b>Accessories</b><ul class="acc">
    ${day.acc.map((a, i) => `<li><button class="check ${log.acc[i] ? "done" : ""}" data-acc="${i}" aria-label="Mark ${esc(a)} done">${log.acc[i] ? "✓" : ""}</button>${esc(a)}</li>`).join("")}
  </ul></div>` : ""}
  <button class="btn ${log.done ? "secondary" : ""}" id="finish">${log.done ? "Done ✓ (tap to reopen)" : day.test ? "Finish and start next block" : "Finish workout"}</button>
  <p class="note" style="margin-top:12px">${day.test ? "" : "Tap a set's circle when you finish it; the rest timer starts. Change the reps box if you got fewer than planned."}</p>`;
}
// Saved on Finish so the chart can date workouts and keep the weights used then, even after the max changes
function stamp(log, sets) { log.done = true; log.at = new Date().toISOString(); log.w = sets.map(x => x.w); }
function amrapNote(log, sets) {
  const i = sets.findIndex(x => x.amrap), r = +(log.sets[i]?.reps || 0);
  if (!r) return "Do as many clean reps as you can. 10 or more means you're on pace for a big test day.";
  return `${sets[i].w} × ${r} estimates your max at about ${Math.round(epley(sets[i].w, r))} lb.`;
}
function bindSession() {
  if (state.block > totalBlocks()) return;
  const s = viewing || nextSession(); if (!s) return;
  const id = sid(s.week, s.d), log = sessionLog(id), day = s.day;
  const sets = setsFor(day);
  document.querySelectorAll("[data-set]").forEach(b => b.onclick = () => {
    const i = +b.dataset.set, st = (log.sets[i] ||= {});
    st.done = !st.done; save();
    if (st.done) startTimer(day.rest);
    render();
  });
  document.querySelectorAll("[data-reps]").forEach(inp => inp.onchange = () => {
    const i = +inp.dataset.reps; (log.sets[i] ||= {}).reps = +inp.value; save();
    const n = $("#amrapNote"); if (n) n.textContent = amrapNote(log, sets);
  });
  document.querySelectorAll("[data-acc]").forEach(b => b.onclick = () => {
    const i = +b.dataset.acc; log.acc[i] = !log.acc[i]; save(); render();
  });
  const tm = $("#testMax"); if (tm) tm.onchange = () => { log.testMax = +tm.value; save(); };
  const back = $("#backNext"); if (back) back.onclick = () => { viewing = null; render(); };
  $("#finish").onclick = () => {
    if (log.done) { log.done = false; save(); render(); return; }
    if (day.test) {
      const m = +(log.testMax || 0);
      if (!(m >= BAR)) { toast("Enter your heaviest clean single first."); return; }
      stamp(log, sets);
      state.block += 1; state.max = Math.round(m);
      state.history.push({ block: state.block, max: state.max, date: new Date().toISOString(), source: "max test" });
      save(); viewing = null; stopTimer();
      render();
      const hit = state.max >= state.goal ? ` You hit ${state.goal}!` : "";
      toast(state.block > totalBlocks() ? `New max ${state.max} lb. Program complete.${hit}`
        : `New max ${state.max} lb. Weeks ${overallWeek(1)}–${overallWeek(BLOCK_WEEKS)} are ready.${hit}`);
      return;
    }
    stamp(log, sets); save(); viewing = null; stopTimer(); render();
  };
}

// ---- Program grid ----
function programView() {
  const nx = nextSession(), nxId = nx && sid(nx.week, nx.d);
  if (state.block > totalBlocks()) return `<h1>Program complete</h1><p class="sub">Add more weeks in Progress to keep going.</p>`;
  return `<h1>Weeks ${overallWeek(1)}–${overallWeek(BLOCK_WEEKS)} of ${state.weeks}</h1><p class="sub">Tap any day to open it. Weights use your max of ${state.max} lb. Week ${overallWeek(BLOCK_WEEKS)} ends with a max test that sets the next weeks' weights.</p>
  ${PROGRAM.map(wk => `<h2>Week ${overallWeek(wk.week)}</h2><div class="grid">
    ${wk.days.map((day, i) => {
      const id = sid(wk.week, i + 1), done = state.log[id]?.done;
      const label = day.test ? "Work up to a max" : `${day.sets}×${day.reps} @ ${roundTo5(state.max * day.pct)}`;
      return `<button class="cell ${done ? "done" : ""} ${id === nxId ? "next" : ""}" data-w="${wk.week}" data-d="${i + 1}">
        <b>${done ? "✓ " : ""}${esc(day.name)}</b><span>${label}</span></button>`;
    }).join("")}
  </div>`).join("")}`;
}
function bindProgram() {
  document.querySelectorAll(".cell").forEach(c => c.onclick = () => {
    const w = +c.dataset.w, d = +c.dataset.d;
    viewing = allSessions().find(s => s.week === w && s.d === d);
    tab = "today"; render();
  });
}

// ---- Progress ----
// ---- Progress chart ----
// Estimated max from finished workouts, only where a set beat the plan (week 3 max-reps sets, or more reps than planned).
// Normal sets sit below the max on purpose, so they would read as going backward.
function workoutEstimates() {
  const out = [];
  for (const [id, log] of Object.entries(state.log)) {
    const m = /^b\d+w(\d)d(\d)$/.exec(id), day = m && PROGRAM[m[1] - 1]?.days[m[2] - 1];
    if (!day || day.test || !log.done || !log.at || !log.w) continue;
    let best = 0;
    log.w.forEach((w, i) => {
      const r = +(log.sets[i]?.reps || 0), amrap = day.amrap && i === day.sets;
      if (r && (amrap || r > day.reps)) best = Math.max(best, epley(w, r));
    });
    if (best) out.push({ t: Date.parse(log.at), v: Math.round(best) });
  }
  return out.sort((a, b) => a.t - b.t);
}
function chartView() {
  const DAY = 864e5, W = 326, H = 190, L = 34, R = 8, T = 10, B = 24;
  const maxes = state.history.map(h => ({ t: Date.parse(h.date), v: h.max })).sort((a, b) => a.t - b.t);
  const dots = workoutEstimates();
  const now = Math.max(Date.now(), maxes.at(-1).t);
  const weeksLeft = Math.max(0, state.weeks - (state.block - 1) * BLOCK_WEEKS);
  const outlook = weeksLeft ? [{ t: now, v: state.max }, { t: now + weeksLeft * 7 * DAY, v: projection(state.max, weeksLeft) }] : [];
  const all = [...maxes, ...dots, ...outlook];
  const t0 = maxes[0].t, t1 = Math.max(t0 + 7 * DAY, ...all.map(p => p.t));
  const lo = Math.floor((Math.min(...all.map(p => p.v)) - 5) / 10) * 10;
  const hi = Math.ceil((Math.max(state.goal, ...all.map(p => p.v)) + 5) / 10) * 10;
  const x = t => (L + (t - t0) / (t1 - t0) * (W - L - R)).toFixed(1);
  const y = v => (T + (hi - v) / (hi - lo) * (H - T - B)).toFixed(1);
  // Max line is a step: each max holds until the next test or change
  let step = `M${x(maxes[0].t)},${y(maxes[0].v)}`;
  maxes.slice(1).forEach(p => { step += ` H${x(p.t)} V${y(p.v)}`; });
  step += ` H${x(now)}`;
  const ticks = [lo, Math.round((lo + hi) / 20) * 10, hi];
  const day = t => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  return `<div class="card"><b>Max over time</b>
    <svg id="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Max over time, ${state.max} lb now, goal ${state.goal} lb" style="display:block;margin-top:8px">
      ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v)}" dy="4" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join("")}
      <line x1="${L}" x2="${W - R}" y1="${y(state.goal)}" y2="${y(state.goal)}" stroke="var(--muted)" stroke-dasharray="5 4"/>
      <text x="${W - R}" y="${y(state.goal)}" dy="14" text-anchor="end" font-size="11" fill="var(--muted)">Goal ${state.goal}</text>
      ${outlook.length ? `<line class="outlook" x1="${x(outlook[0].t)}" y1="${y(outlook[0].v)}" x2="${x(outlook[1].t)}" y2="${y(outlook[1].v)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" opacity=".7"/>` : ""}
      <path class="maxline" d="${step}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
      ${maxes.map(p => `<circle class="maxpt" cx="${x(p.t)}" cy="${y(p.v)}" r="4" fill="var(--accent)"/>`).join("")}
      ${dots.map(p => `<circle class="est" cx="${x(p.t)}" cy="${y(p.v)}" r="4" fill="var(--bg)" stroke="var(--good)" stroke-width="2"><title>${p.v} lb estimate</title></circle>`).join("")}
      <text x="${L}" y="${H - 6}" font-size="11" fill="var(--muted)">${day(t0)}</text>
      <text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">${day(t1)}</text>
    </svg>
    <p class="note" style="margin:6px 0 0"><span style="color:var(--accent)">●</span> Max &nbsp;<span style="color:var(--good)">○</span> Workout estimate (you beat the plan)${outlook.length ? ` &nbsp;<span style="color:var(--accent)">┈</span> Outlook, about ${GAIN_PER_BLOCK} lb per block (estimate)` : ""}</p>
  </div>`;
}
function progressView() {
  const finished = state.block > totalBlocks();
  const doneHere = finished ? 0 : allSessions().filter(s => state.log[sid(s.week, s.d)]?.done).length;
  const total = state.weeks * 3, done = Math.min(total, (Math.min(state.block, totalBlocks() + 1) - 1) * 12 + doneHere);
  const span = state.goal - state.startMax, pct = span > 0 ? Math.min(100, Math.max(0, (state.max - state.startMax) / span * 100)) : 100;
  const weeksLeft = Math.max(0, state.weeks - (state.block - 1) * BLOCK_WEEKS);
  return `<h1>${esc(state.name)}</h1>
  <div class="card">
    <div class="row spread"><span class="muted">Current max</span><span class="muted">Goal</span></div>
    <div class="row spread"><span class="big">${state.max}</span><span class="big muted">${state.goal}</span></div>
    <div class="bar" style="margin-top:10px"><div style="width:${pct}%"></div></div>
    <p class="note">${state.max >= state.goal ? "Goal reached." : `${state.goal - state.max} lb to go. ${weeksLeft ? outlook(state.max, state.goal, weeksLeft).replace(`after ${weeksLeft} weeks`, `after the ${weeksLeft} weeks left`) : ""}`}</p>
  </div>
  ${chartView()}
  <div class="card"><div class="row spread"><b>${state.weeks}-week program</b><span class="muted">${done} of ${total} workouts</span></div>
    <div class="bar" style="margin-top:10px"><div style="width:${done / total * 100}%"></div></div></div>
  <div class="card"><b>Max history</b>
    <table><tr><th>Block</th><th>Max</th><th>Date</th><th>From</th></tr>
    ${state.history.map(h => `<tr><td>${h.block}</td><td>${h.max}</td><td>${new Date(h.date).toLocaleDateString()}</td><td class="muted">${esc(h.source)}</td></tr>`).join("")}
    </table></div>
  <div class="card"><b>Backup</b>
    <p class="note">Your data lives only on this phone. Copy a backup now and then (paste it into Notes), and paste it back here to restore.</p>
    <div class="row"><button class="btn small secondary" id="copyBk">Copy backup</button><button class="btn small secondary" id="restoreBk">Restore</button></div>
    <textarea id="bk" rows="3" class="hidden" style="margin-top:10px" placeholder="Paste a backup here"></textarea>
  </div>
  <div class="card"><b>Settings</b>
    <label for="newMax">Change current max (lb)</label>
    <div class="row"><input id="newMax" type="number" inputmode="decimal" value="${state.max}"><button class="btn small" id="saveMax">Save</button></div>
    <p class="note">Lower it by 10 lb if the heavy days feel like grinders.</p>
    <label for="newGoal">Target bench (lb)</label>
    <div class="row"><input id="newGoal" type="number" inputmode="decimal" value="${state.goal}"><button class="btn small" id="saveGoal">Save</button></div>
    <label>Program length</label>
    <div class="row" style="flex-wrap:wrap">
      ${DURATIONS.map(d => `<button class="btn small ${d === state.weeks ? "" : "secondary"}" data-len="${d}" aria-pressed="${d === state.weeks}">${d} weeks</button>`).join("")}
    </div>
    <p class="note">You're in week ${Math.min(state.weeks, overallWeek(1))}. A length can't be shorter than the 4-week block you're in.</p>
    <button class="btn secondary" id="reset" style="margin-top:8px">Start over</button>
  </div>`;
}
function bindProgress() {
  $("#saveMax").onclick = () => {
    const m = +$("#newMax").value; if (!(m >= BAR)) return;
    state.max = Math.round(m); state.history.push({ block: state.block, max: state.max, date: new Date().toISOString(), source: "manual change" });
    save(); render();
  };
  $("#saveGoal").onclick = () => {
    const g = Math.round(+$("#newGoal").value);
    if (!(g > state.max)) { toast(`Set a target above your current max of ${state.max} lb.`); return; }
    state.goal = g; save(); render(); toast(`Goal set to ${g} lb.`);
  };
  document.querySelectorAll("[data-len]").forEach(b => b.onclick = () => {
    // Can't end before the block you're in (or, once finished, before the weeks already done)
    const finished = state.block > totalBlocks();
    const minWeeks = (state.block - 1) * BLOCK_WEEKS + (finished ? 0 : BLOCK_WEEKS);
    const w = +b.dataset.len;
    if (w < minWeeks) { toast(`You've reached week ${Math.min(minWeeks, overallWeek(1))}, so the shortest option is ${minWeeks} weeks.`); return; }
    state.weeks = w; save(); render(); toast(`Program length set to ${w} weeks.`);
  });
  $("#copyBk").onclick = async () => {
    const data = JSON.stringify(state);
    try { await navigator.clipboard.writeText(data); toast("Backup copied. Paste it into Notes."); }
    catch { const t = $("#bk"); t.classList.remove("hidden"); t.value = data; t.select(); }
  };
  $("#restoreBk").onclick = () => {
    const t = $("#bk");
    if (t.classList.contains("hidden") || !t.value.trim()) { t.classList.remove("hidden"); t.value = ""; t.focus(); return; }
    try {
      const s = JSON.parse(t.value);
      if (!s || typeof s.max !== "number" || !s.log || !s.history) throw 0;
      confirmTap($("#restoreBk"), `Tap again to replace with ${s.name}'s backup`, () => { state = s; save(); render(); toast("Backup restored."); });
    } catch { toast("That doesn't look like a Weight Training backup."); }
  };
  $("#reset").onclick = () => confirmTap($("#reset"), "Tap again to erase everything", () => {
    try { localStorage.removeItem(KEY); } catch {}
    state = null; tab = "today"; render();
  });
}

// ---- Rest timer (uses an end time, so it stays correct if the phone sleeps) ----
let timerEnd = 0, timerId = 0;
function startTimer(sec) {
  timerEnd = Date.now() + sec * 1000; $("#timer").classList.add("on"); document.body.classList.add("timing"); $("#timer").classList.remove("over");
  clearInterval(timerId); tick(); timerId = setInterval(tick, 250);
}
function tick() {
  const left = Math.round((timerEnd - Date.now()) / 1000);
  const el = $("#timer");
  if (left <= 0) { el.classList.add("over"); $("#timerText").textContent = "Rest done — next set"; return; }
  $("#timerText").textContent = `Rest ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
}
function stopTimer() { clearInterval(timerId); $("#timer").classList.remove("on", "over"); document.body.classList.remove("timing"); }
$("#timerStop").onclick = stopTimer;

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; viewing = null; render(); });
render();

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
